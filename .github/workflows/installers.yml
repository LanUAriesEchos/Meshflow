name: Installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build rpm dpkg-dev qt6-base-dev qt6-tools-dev \
            qt6-base-private-dev libqt6svg6-dev libgl1-mesa-dev libxtst-dev libxkbcommon-dev \
            libei-dev libeis-dev libportal-dev libglib2.0-dev libssl-dev libcurl4-openssl-dev \
            libx11-dev libxi-dev libxrandr-dev libxinerama-dev libxkbfile-dev libpugixml-dev \
            libgtk-3-dev libnotify-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
      - run: cmake --build build
      - run: cd build && cpack -G "DEB;RPM"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/*.deb
            build/*.rpm

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake ninja qt@6 pugixml openssl
      - run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
      - run: cmake --build build
      - run: cd build && cpack
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            build/*.dmg
            build/*.pkg

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
      - run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add -g WixToolset.Util.wixext/4.0.5
          wix extension add -g WixToolset.Firewall.wixext/4.0.5
          wix extension add -g WixToolset.UI.wixext/4.0.5
          wix extension add -g WixToolset.Bal.wixext/4.0.5
      - run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DBUILD_TESTS=OFF
          cmake --build build --config Release
          cmake --build build --config Release --target meshflow_exe_bootstrapper
          cd build
          cpack -C Release -G WIX
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            build/*.msi
            build/*.exe
